{% extends "base.html" %}
{% block title %}Entrar · ConectaFeira AL{% endblock %}
{% block content %}
<section class="auth-wrap"><p class="eyebrow">Bom ter você de volta</p><h1>Entrar</h1><p class="muted">Acesse sua conta para continuar.</p>
  {% if error %}<div class="alert">{{ error }}</div>{% endif %}
  <form class="panel form-stack" method="post" action="/login">
    <label>E-mail<input name="email" type="email" autocomplete="email" required></label>
    <label>Senha<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="button" type="submit">Entrar</button>
  </form>
  <p class="auth-foot">Ainda não tem uma conta? <a href="/criar-conta">Criar conta</a></p>
</section>
{% endblock %}
